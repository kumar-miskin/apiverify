[project]
name = "apiverify"
version = "0.1.3"
description = "Source-backed check of whether a Python API exists in an exact package version. Answers verified, not_found, or cannot_verify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["mcp", "ai-agents", "api-verification", "hallucination", "pypi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kumar-miskin/apiverify"
Source = "https://github.com/kumar-miskin/apiverify"
Issues = "https://github.com/kumar-miskin/apiverify/issues"

[project.scripts]
apiverify = "apiverify.cli:main"
apiverify-mcp = "apiverify.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apiverify"]
